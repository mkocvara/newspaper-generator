<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- Android uses the manifest's transparent icons. iPhones get an opaque
         apple-touch-icon, added in main.ts on iOS only (other browsers, such as
         Firefox on Android, would use it too). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- maximum-scale stops phones zooming the whole app in when a small text
         field is focused; the page has its own pinch zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <title>Newspaper Generator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
