<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A newspaper in the app's colours: newsprint and ink. Drawn on a 4-unit
       grid, so at 16px every edge and line falls on a whole pixel. -->
  <!-- The sheet behind, peeking out at the top right. -->
  <rect x="16" y="4" width="44" height="48" rx="4" fill="#1b1a17" />
  <rect x="20" y="8" width="36" height="40" fill="#d8ccb0" />
  <!-- The front page. -->
  <rect x="4" y="12" width="44" height="48" rx="4" fill="#1b1a17" />
  <rect x="8" y="16" width="36" height="40" fill="#f2ede1" />
  <!-- Masthead, a picture with text beside it, and a line below. -->
  <rect x="12" y="20" width="28" height="8" fill="#1b1a17" />
  <rect x="12" y="32" width="12" height="12" fill="#6e6656" />
  <rect x="28" y="32" width="12" height="4" fill="#1b1a17" />
  <rect x="28" y="40" width="12" height="4" fill="#1b1a17" />
  <rect x="12" y="48" width="28" height="4" fill="#1b1a17" />
</svg>
